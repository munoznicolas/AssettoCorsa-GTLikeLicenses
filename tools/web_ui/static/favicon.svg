<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="gtRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="gtWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#ef4444" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner border accent -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Stylized "GT" Monogram -->
  <g font-family="'Chakra Petch', 'Arial Black', sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <!-- "G" in GT Red Gradient -->
    <text x="23" y="44" font-size="34" fill="url(#gtRed)" letter-spacing="-2">G</text>
    <!-- "T" in Silver / White Gradient with slight overlap -->
    <text x="43" y="44" font-size="34" fill="url(#gtWhite)" letter-spacing="-2">T</text>
  </g>

  <!-- Speed slash accent line -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
</svg>
